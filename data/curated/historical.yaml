# Hand-curated historical scenarios (spec §3.1, target ~40).
#
# Multi-party episodes with unambiguous outcomes. These are the scenarios that
# most stress causal decomposition, because they have the most actors.
#
# TEMPLATE — every field is required and the loader refuses the file otherwise:
#   id                    stable slug; becomes scenario_id as `curated:<id>`
#   question              binary, resolvable to 0 or 1 with no ambiguity
#   resolution_criterion  what exactly counted as YES
#   domain                one of the tags in cascade/ledger/schema.py::Domain
#   parties               >= 3 distinguishable parties with non-identical
#                         objectives. Not a cast list: each must have wanted
#                         something different.
#   open_ts               when the question became publicly live
#   cutoff_ts             chosen by judgement: enough public information
#                         existed to reason, and the outcome was genuinely
#                         unsettled. Must leave > 21 days to resolution.
#   resolved_at           when the outcome became fact
#   outcome               1 = YES, 0 = NO
#   provenance            how a reviewer checks this entry
#
# REVIEW STATUS: authored from the public record, NOT independently verified.
# Each entry is a hand-written label on a forecasting benchmark, and a wrong
# label corrupts the headline metric silently. Verify every date and outcome
# against the cited record before the study is published.

- id: brexit-referendum-2016
  question: Will the United Kingdom vote to leave the European Union in the June 2016 referendum?
  resolution_criterion: >-
    YES if the official result declared by the Electoral Commission is a
    majority for Leave.
  domain: elections
  parties:
    - UK Government
    - European Commission
    - Vote Leave
    - Britain Stronger in Europe
    - Scottish Government
  open_ts: 2016-02-20
  cutoff_ts: 2016-04-15
  resolved_at: 2016-06-24
  outcome: 1
  provenance: UK Electoral Commission EU referendum result, 23-24 June 2016 (Leave 51.9%).

