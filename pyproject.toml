[project]
name = "cascade"
version = "0.1.0"
description = "Multi-agent causal simulation for strategic forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "langfuse>=2.50,<3",
]

[project.optional-dependencies]
# Heavy ML stack: needed from M2 (corpus embedding) onward, not for M0/M1.
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
# Analytics stack: needed from M6 (Parquet export) onward.
analytics = [
    "duckdb>=1.0",
    "pyarrow>=16.0",
]
# Orchestration: needed from M5 (kernel) onward.
kernel = [
    "langgraph>=0.2,<0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
    "types-PyYAML>=6.0",
]

[project.scripts]
# Points at main(), not app(), so the process-wide error boundary is what maps
# BudgetExceeded / CacheMiss onto their distinct exit codes.
cascade = "cascade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

# ---------------------------------------------------------------------------
# Engineering standards (spec §13). These are enforced in CI, not by intention.
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["cascade"]
warn_unreachable = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langfuse.*", "psycopg.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",  # ruff-specific
    "S",    # flake8-bandit: subprocess/SQL/secret handling
    "BLE",  # blind except -- see the anti-pattern list in the spec
]
ignore = [
    "E501",   # line length is black's job
    "B008",   # typer uses function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), spawn subprocesses deliberately (S603/S607), and carry
# placeholder credentials in fixtures (S105/S106).
"tests/**" = ["E402", "S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live Postgres/Langfuse (deselect with '-m \"not integration\"')",
    "network: makes real API calls and costs money (deselect by default)",
]
filterwarnings = ["error::DeprecationWarning:cascade.*"]
